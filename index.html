    -->
    <title>Gujarat JUG - Official Community Page</title>
    <meta data-rh="true" name="description" content="Gujarat Java User Group (JUG) is a thriving community of Java developers, tech enthusiasts, and industry professionals. Join us to learn, network, and grow!" />
